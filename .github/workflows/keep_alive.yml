name: Keep Streamlit Alive

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to Streamlit app
        run: |
          curl -s -L -A "Mozilla/5.0" --max-time 30 "https://farad-bot.streamlit.app/" > /dev/null || true
          echo "App pinged successfully!"

name: Keep Streamlit Alive

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Ping Streamlit App with Playwright
        run: |
          python -c "
          import re
          import time
          from playwright.sync_api import sync_playwright, TimeoutError

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              print('Łączenie z aplikacją Streamlit...')
              
              page.goto('https://farad-bot.streamlit.app/', wait_until='networkidle', timeout=60000)
              
              sleep_button = page.get_by_role('button', name=re.compile('get.*back up', re.IGNORECASE))
              
              try:
                  sleep_button.wait_for(state='visible', timeout=10000)
                  print('Aplikacja była uśpiona. Klikam przycisk wybudzania...')
                  sleep_button.click()
                  time.sleep(15)
                  print('Przycisk kliknięty, aplikacja się wybudza.')
              except TimeoutError:
                  print('Aplikacja jest już aktywna.')

              browser.close()
              print('Zakończono pomyślnie.')
          "
